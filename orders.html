<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My orders | Akwete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Gloock&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">Akwete</a>
  <div class="tools">
    <a class="pill" href="index.html#shop">Shop</a>
    <a class="pill" href="checkout.html">Bag (<span data-bag-count>0</span>)</a>
    <button class="pill" id="outBtn" hidden>Sign out</button>
  </div>
</header>

<main class="wrap" style="max-width:820px">
  <h1>My orders</h1>
  <div class="warn" id="cfgWarn" hidden>
    The database is not connected yet. Add your Supabase URL and anon key in <code>js/config.js</code>, then reload.
  </div>
  <div id="signedOut" hidden>
    <p style="margin-bottom:20px">Sign in with Google to see the orders saved to your account.</p>
    <button class="btn google" id="inBtn">Continue with Google</button>
  </div>
  <p id="status" class="fine"></p>
  <div id="list"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/shared.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  var STATUS = { pending: 'Received', confirmed: 'Confirmed', in_production: 'In production', shipped: 'Shipped', delivered: 'Delivered', cancelled: 'Cancelled' };

  $('#inBtn').onclick = function () { AK.signIn(); };
  $('#outBtn').onclick = function () { AK.signOut(); };

  async function load() {
    $('#cfgWarn').hidden = AK.configured;
    $('#signedOut').hidden = !!AK.user || !AK.configured;
    $('#outBtn').hidden = !AK.user;
    $('#list').innerHTML = '';
    if (!AK.user || !AK.sb) { $('#status').textContent = ''; return; }
    $('#status').textContent = 'Loading...';
    var r = await AK.sb.from('orders')
      .select('id, order_number, status, total_ngn, created_at, confirmation_sent_at, order_items(name, detail, quantity, unit_price_ngn)')
      .order('created_at', { ascending: false });
    if (r.error) { $('#status').textContent = 'Could not load orders: ' + r.error.message; return; }
    if (!r.data.length) { $('#status').innerHTML = 'No orders yet. <a href="index.html#shop">Browse the shop</a>.'; return; }
    $('#status').textContent = '';
    $('#list').innerHTML = r.data.map(function (o) {
      var when = new Date(o.created_at).toLocaleDateString('en-NG', { day: 'numeric', month: 'long', year: 'numeric' });
      return '<article class="order"><header><strong>' + esc(o.order_number) + '</strong><span class="badge">' + esc(STATUS[o.status] || o.status) + '</span></header>' +
        '<p class="fine">' + esc(when) + (o.confirmation_sent_at ? ' &middot; confirmation email sent' : '') + '</p>' +
        '<ul>' + (o.order_items || []).map(function (i) {
          return '<li><span>' + esc(i.name) + (i.quantity > 1 ? ' &times; ' + i.quantity : '') + '<br><small class="fine">' + esc(i.detail) + '</small></span><span>' + AK.naira(i.unit_price_ngn * i.quantity) + '</span></li>';
        }).join('') + '</ul>' +
        '<p style="text-align:right"><strong>' + AK.naira(o.total_ngn) + '</strong></p></article>';
    }).join('');
  }
  AK.ready.then(load);
  window.addEventListener('authchange', load);
})();
</script>
</body>
</html>
